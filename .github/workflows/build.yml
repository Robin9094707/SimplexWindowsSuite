name: Windows-Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "1.0.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Tests (Kernbibliothek)
        run: dotnet test tests/SimplexSuite.Core.Tests/SimplexSuite.Core.Tests.csproj -c Release --nologo

      - name: App veröffentlichen (self-contained, x64)
        run: >
          dotnet publish src/SimplexSuite/SimplexSuite.csproj -c Release -r win-x64 -p:Platform=x64
          --self-contained true -p:Version=${{ steps.ver.outputs.version }}
          -p:PublishReadyToRun=false -o publish/SimplexSuite

      - name: FFmpeg und RNNoise-Modell beilegen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "publish/SimplexSuite/ffmpeg"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = "$env:RUNNER_TEMP/ffmpeg.zip"
          try {
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          } catch {
            Write-Host "BtbN nicht erreichbar, nutze gyan.dev"
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/ff" -Force
          Get-ChildItem "$env:RUNNER_TEMP/ff" -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination $dest
          $lic = Get-ChildItem "$env:RUNNER_TEMP/ff" -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$dest/FFMPEG-LICENSE.txt" }
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/GregorR/rnnoise-models/master/somnolent-hogwash-2018-09-01/sh.rnnn" -OutFile "$dest/sh.rnnn"
          } catch { Write-Warning "RNNoise-Modell konnte nicht geladen werden" }
          & "$dest/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          Get-ChildItem $dest

      - name: Rauchtest (App starten + Screenshots)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try { Set-DisplayResolution -Width 1600 -Height 900 -Force -ErrorAction Stop } catch { Write-Host "Auflösung bleibt: $_" }
          $exe = (Resolve-Path "publish/SimplexSuite/SimplexSuite.exe").Path
          $ff = (Resolve-Path "publish/SimplexSuite/ffmpeg/ffmpeg.exe").Path
          $shots = "$env:RUNNER_TEMP/shots"; New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $samples = "$env:RUNNER_TEMP/samples"; New-Item -ItemType Directory -Force -Path $samples | Out-Null
          & $ff -v error -y -f lavfi -i "sine=f=220:d=8" -f lavfi -i "anoisesrc=a=0.02:d=8" -filter_complex "[0][1]amix=inputs=2" "$samples/podcast.wav"
          & $ff -v error -y -f lavfi -i "testsrc2=s=1280x720:r=30:d=6" -f lavfi -i "sine=f=440:d=6" -shortest -c:v libx264 -pix_fmt yuv420p "$samples/clip.mp4"
          & $ff -v error -y -f lavfi -i "testsrc=s=800x1100:d=1" -frames:v 1 "$samples/scan.png"
          $failed = $false
          foreach ($case in @(@{n="start"; a=""}, @{n="podcast"; a="$samples/podcast.wav"}, @{n="video"; a="$samples/clip.mp4"}, @{n="pdf"; a="$samples/scan.png"})) {
            if ($case.a) { $p = Start-Process $exe -ArgumentList "`"$($case.a)`"" -PassThru } else { $p = Start-Process $exe -PassThru }
            Start-Sleep -Seconds 25
            $alive = -not $p.HasExited
            Write-Host "$($case.n): läuft = $alive"
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$shots/$($case.n).png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            if (-not $alive) { $failed = $true; Write-Warning "App beendet (Exit $($p.ExitCode))" }
            else { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 2
          }
          $log = "$env:LOCALAPPDATA/SimplexSuite/error.log"
          if (Test-Path $log) { Copy-Item $log $shots; Get-Content $log | Select-Object -First 60 }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SimplexSuite' } | Select-Object -First 5 | ForEach-Object { $_.Message } | Out-File "$shots/events.txt"
          if (Test-Path "$shots/events.txt") { Get-Content "$shots/events.txt" }
          if ($failed) { exit 1 }

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots/*

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/SimplexSuite.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen" }

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/SimplexSuite/* -DestinationPath "artifacts/SimplexSuite-Portable-${{ steps.ver.outputs.version }}-x64.zip" -CompressionLevel Optimal

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SimplexSuite-${{ steps.ver.outputs.version }}
          path: artifacts/*
          compression-level: 0

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
